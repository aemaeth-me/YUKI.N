name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  haskell-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check Fourmolu formatting
        uses: haskell-actions/run-fourmolu@v13
        with:
          version: "0.20.0.0"
          pattern: |
            src/**/*.hs
            app/**/*.hs
            test/**/*.hs

      - name: Set up HLint
        uses: haskell-actions/hlint-setup@v2
        with:
          version: "3.10"

      - name: Run HLint
        uses: haskell-actions/hlint-run@v2
        with:
          path: '["src/", "app/", "test/"]'
          fail-on: error

  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.10"
          cabal-version: "3.14"

      - name: Cabal cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cabal/store
            dist-newstyle
          key: ${{ runner.os }}-cabal-${{ hashFiles('yuki-n.cabal') }}
          restore-keys: |
            ${{ runner.os }}-cabal-

      - name: Build
        run: cabal build all

      - name: Test
        run: cabal test yuki-n-test --test-show-details=direct
